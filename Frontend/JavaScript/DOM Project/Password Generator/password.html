<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <img id="background" src="./premium_photo-1752538951633-051d8306b2ae.avif" alt="">

        <div class="box">
            <h2>Password Generator</h2>

            <div class="display-box">
                <input data-passwordDisplay readonly placeholder="Password">
                
                <button id="copy-img" data-copyButton>
                    <span data-copyMSG></span>
                    <img src="./file-copy-line.png" alt="copy">
                </button>
            </div>

            <div class="input-box">

                <!-- Password Length section -->
                <div class="ps-length">
                    <h6>Password Length</h6>
                    <p data-length>0</p>
                </div>


                <!-- Slider -->
                <input type="range" min="1" max="20" step="1" data-lengthSlider>


                <!-- checkboxes -->
                <div class="check-boxes">
                    <input type="checkbox" id="uppercase" unchecked>
                    <label for="uppercase">Include Uppercase Letters</label>
                </div>

                <div class="check-boxes">
                    <input type="checkbox" id="lowercase" unchecked>
                    <label for="lowercase">Include Lowercase Letters</label>    
                </div>

                <div class="check-boxes">
                    <input type="checkbox" id="numbers" unchecked>
                    <label for="numbers">Include Numbers</label>
                </div>  

                <div class="check-boxes">
                    <input type="checkbox" id="symbols" unchecked>
                    <label for="symbols">Include Symbols</label> 
                </div>


                <!-- Strength Indicator -->
                <div class="strength-indicator">
                    <h6>Strength</h6>
                    <div data-indicator class="strength-circle"></div>
                </div>

                <button data-generate>Generate Password</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
