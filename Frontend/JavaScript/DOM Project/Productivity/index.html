<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet"/>
</head>
<body>
    <div id="main">
        <nav>

        </nav>

        <section class="allElems">
            <div class="todo elem" id="0">
                <img src="https://images.unsplash.com/photo-1670236246360-b0afceb96b87?q=80&w=464&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="">
                <h2>To Do List</h2>
            </div>
            <div class="daily elem" id="1">
                <img src="https://images.unsplash.com/photo-1743000149756-145c60327c90?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1yZWxhdGVkfDF8fHxlbnwwfHx8fHw%3D" alt="">
                <h2>Daily Planner</h2>
            </div>
            <div class="moti elem" id="2">
                <img src="https://images.unsplash.com/photo-1647351408653-d582b364bf2f?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1yZWxhdGVkfDE1fHx8ZW58MHx8fHx8" alt="">
                <h2>Motivation</h2>
            </div>
            <div class="pomo elem" id="3">
                <img src="https://images.unsplash.com/photo-1673245886405-e33aa93b0de3?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1yZWxhdGVkfDEwfHx8ZW58MHx8fHx8" alt="">
                <h2>Pomodoro Time</h2>
            </div>
            <div class="goals elem" id="4">
                <img src="https://images.unsplash.com/photo-1716571481936-75da7295a81e?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1yZWxhdGVkfDExfHx8ZW58MHx8fHx8" alt="">
                <h2>Daily Goals</h2>
            </div>
        </section>



        <section class="fullElem todo-list-fullPage">
            <button class="back" id="0"><i class="ri-close-line"></i></button>
            
            <h2>Your Personalised Task List</h2>

            <div class="todo-Container">
                <div class="addTask">
                    <form>
                        <input id="text-input" type="text" placeholder="Enter Task">
                        <textarea id="text-input" name="" id="" cols="20" placeholder="Enter details"></textarea>

                        <div class="mark-imp">
                            <input type="checkbox"  id="check">
                            <label for="check">Mark as Important</label>
                        </div>
                        <button>Add Task</button>
                    </form>
                </div>



                <div class="allTask"></div>

            </div>
        </section>
        <section class="fullElem daily-planner-fullPage">
            <button class="back" id="1"><i class="ri-close-line"></i></button>
            <h2></h2>
        </section>
        <section class="fullElem motivation-fullPage">
            <button class="back" id="2"><i class="ri-close-line"></i></button>
            <h1>Motivation Quote</h1>
        </section>
        <section class="fullElem promodor-fullPage">
            <button class="back" id="3"><i class="ri-close-line"></i></button>
            <h1>Promodor Timer</h1>
        </section>
        <section class="fullElem daily-goals-fullPage">
            <button class="back" id="4"><i class="ri-close-line"></i></button>
            <h1>Daily Goals</h1>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
